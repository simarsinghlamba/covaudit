services:
  audit:
    build: .
    image: covaudit:local
    command: covaudit run --config configs/repair.yaml --out outputs/repair
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs

  shift:
    build: .
    image: covaudit:local
    command: covaudit shift --config configs/shift.yaml --out outputs/shift
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs

  report:
    build: .
    image: covaudit:local
    command: covaudit report --results outputs --out outputs/report
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      audit:
        condition: service_completed_successfully
      shift:
        condition: service_completed_successfully

  tests:
    build: .
    image: covaudit:local
    command: pytest -q
    profiles: ["test"]

  notebook:
    build: .
    image: covaudit:local
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --IdentityProvider.token='' --ServerApp.root_dir=/app --allow-root
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./outputs:/app/outputs
    profiles: ["notebook"]
