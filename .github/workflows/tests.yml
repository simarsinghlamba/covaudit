name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with test tools
        run: pip install -e ".[dev]"
      - name: Check code style
        run: ruff check .
      - name: Run tests
        run: pytest -q
