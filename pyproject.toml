[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covaudit"
dynamic = ["version"]
description = "Audit and repair subgroup coverage of conformal prediction"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Simar Singh Lamba"}]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "folktables",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff"]
notebook = ["jupyterlab"]

[project.scripts]
covaudit = "covaudit.cli:main"

[tool.setuptools.dynamic]
version = {attr = "covaudit.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
